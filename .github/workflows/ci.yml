name: CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies (clean lockfile-enforced)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Unit & Component tests (Vitest)
        run: npm run test:unit

      - name: Run Provider Contract tests
        run: npm run test:contracts

      - name: Run Integration tests
        run: npm run test:integration

      - name: Run Security & Privacy regression tests
        run: npm run test:security

      - name: Run Performance regression tests
        run: npm run test:perf

      - name: Run Next.js production build
        run: npm run build

      - name: Install Playwright Chromium & OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run End-to-End tests (Playwright)
        run: npm run test:e2e
        env:
          CI: 'true'

      - name: Upload Playwright Test Report on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
